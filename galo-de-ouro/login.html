<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Galo de Ouro</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

    <script src="js/password.js" defer></script>
    <script src="js/admin-demo.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>

<body class="auth-page">
    <main class="auth-card">
        <a href="index.html" class="auth-brand">
            Galo de Ouro
        </a>

        <h1 id="auth-title" class="auth-title">
            Entre em sua conta
        </h1>

        <p class="auth-description">
            Entre ou cadastre-se para continuar suas compras.
        </p>

        <form id="login-form" class="auth-form" method="post">
            <label for="login-email">E-mail</label>
            <input
                type="email"
                id="login-email"
                name="email"
                autocomplete="username"
                required
            >

            <label for="login-password">Senha</label>
            <input
                type="password"
                id="login-password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="button button-primary">
                Entrar
            </button>
            <p id="login-message" class="auth-message" role="status"></p>
        </form>

        <form
            id="register-form"
            class="auth-form"
            method="post"
            hidden
        >
            <label for="register-name">Nome completo</label>
            <input
                type="text"
                id="register-name"
                name="name"
                autocomplete="name"
                required
            >

            <label for="register-email">E-mail</label>
            <input
                type="email"
                id="register-email"
                name="email"
                autocomplete="username"
                required
            >

            <label for="register-password">Senha</label>
            <input
                type="password"
                id="register-password"
                name="password"
                autocomplete="new-password"
                required
            >

            <label for="register-confirm-password">
                Confirme a senha
            </label>
            <input
                type="password"
                id="register-confirm-password"
                name="password-confirmation"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="button button-primary">
                Criar conta
            </button>
            <p id="register-message" class="auth-message" role="status"></p>
        </form>

        <button type="button" id="auth-toggle" class="auth-switch">
            Não tem conta? Cadastre-se
        </button>
    </main>
</body>

</html>
