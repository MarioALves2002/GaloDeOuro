<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de demonstração | Galo de Ouro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/admin-demo.js" defer></script>
    <script src="js/session.js" defer></script>
    <script src="js/painel.js" defer></script>
</head>
<body class="auth-page">
    <main id="admin-panel" class="auth-card" hidden>
        <a href="index.html" class="auth-brand">Galo de Ouro</a>
        <h1 class="auth-title">Painel de demonstração</h1>
        <p class="auth-description">Painel de demonstração local. As aves ficam salvas apenas neste navegador.</p>
        <dl class="admin-summary" aria-label="Resumo do projeto">
            <div><dt>Aves no catálogo</dt><dd id="total-birds">—</dd></div>
            <div><dt>Contas</dt><dd id="total-accounts">—</dd></div>
            <div><dt>Clientes</dt><dd id="total-clients">—</dd></div>
            <div><dt>Administradores</dt><dd id="total-admins">—</dd></div>
        </dl>
        <p id="panel-message" class="auth-message" role="status"></p>
        <h2>Cadastrar ave</h2>
        <form id="bird-form" class="auth-form">
            <label for="bird-name">Nome da ave</label>
            <input id="bird-name" name="nome" required>
            <label for="bird-breed">Raça</label>
            <input id="bird-breed" name="raca" required>
            <label for="bird-photo">Foto</label>
            <select id="bird-photo" name="foto" required>
                <option value="">Escolha uma foto</option>
                <option value="img/abel.jpg">Abel Ferreira</option>
                <option value="img/imperador.jpg">Imperador</option>
                <option value="img/bruxo.jpg">Bruxo</option>
            </select>
            <button type="submit" class="button button-primary">Salvar ave</button>
            <p id="bird-message" class="auth-message" role="status"></p>
        </form>
        <h2>Aves cadastradas no painel</h2>
        <p id="bird-list-message" class="auth-message"></p>
        <ul id="bird-list" class="admin-birds"></ul>
        <p><a href="loja.html">Abrir loja</a> · <a href="login.html" id="account-link">Sair</a></p>
    </main>
</body>
</html>
